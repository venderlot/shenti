:root{--blue:#b8d5ed}
body{background:#deedf8}

.exhibit{background-color:var(--blue);background-image:radial-gradient(#557b9c12 .6px,transparent .8px);background-size:4px 4px}
.spread:has(.poster){grid-template-columns:minmax(0,.86fr) minmax(0,1.83fr) minmax(220px,.78fr)}
.poster{position:relative;width:100%;height:clamp(632px,48vw,733px);isolation:isolate}
.poster img{position:absolute;left:50%;top:50%;width:min(75%,365px);height:auto;transform:translate(-50%,-50%)}

.poster .picked path,.poster .hovered path{stroke:#68243f;stroke-width:2;stroke-dasharray:none}
.poster .picked circle,.poster .hovered circle{fill:#70213e}
.poster .ripple{fill:transparent!important;stroke:#923456;stroke-width:1.8;pointer-events:none;transform-box:fill-box;transform-origin:center;animation:atlas-ring 1.7s ease-out infinite}
.poster .poster-label{transform:translateY(-50%);background:transparent;border:1px solid transparent;color:#352c38;padding:3px 7px;min-width:58px;transition:background .16s,border-color .16s,box-shadow .16s,translate .16s;line-height:1.11}

.poster .poster-label:hover,.poster .poster-label:focus-visible{background:#f2f7fc;border-color:#ab8496;translate:0 -2px}
.poster .poster-label[aria-pressed=true]{background:var(--wine);color:#fffaf5;border-color:var(--wine);box-shadow:0 3px 10px #672f4329}
.wordcard{animation:card-in .34s ease-out both}.wordcard .wordzh{animation:ink-in .4s ease-out}

.direct-practice .gram-content{margin-top:20px}.gram-options button:not(:disabled):hover,.gram-bank button:not(:disabled):hover,.bp-token:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 3px 8px #492e431f}

@keyframes ink-in{from{color:#aa5473;translate:0 4px}to{color:var(--wine);translate:0 0}}

@keyframes answer-shake{25%{transform:translateX(-4px)}65%{transform:translateX(4px)}}

.gram-formula small {font-size:11px}
.gr-s {background:#efeae1}.gr-v {background:#ecd4da}.gr-a,.gr-f {background:var(--gr-wine);color:white!important}.gr-d {background:#d5e8f3}.gr-o {background:#f3dba9}.gr-de {background:#e4e8db}
.gram-paper .gram-annotation {margin-top:12px;font-size:.88rem;color:#5e5260;min-height:2.8em}
.gram-reading {border-top:1px solid #d9cfca;margin-top:14px;padding-top:18px}
.gram-reading .zh,.gram-examples .zh {font-size:clamp(22px,2.4vw,33px);line-height:1.5}
.gram-times {border-block:1px solid var(--gr-rule);margin:24px 0}
.gram-times>summary {cursor:pointer;min-height:48px;padding:15px 4px;font-weight:600}
.gram-times summary span {float:right}
.gram-times>div {display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:22px;padding:12px 4px 25px}
.gram-times .zh {font-size:24px}
.gram-examples {display:grid;grid-template-columns:1fr 1fr;column-gap:30px}
.gram-examples article {display:flex;align-items:baseline;gap:18px;padding:18px 0;border-bottom:1px solid var(--gr-rule)}
.gram-examples .ru,.gram-reading .ru {margin-top:6px}
.gram-formats {gap:8px;margin-bottom:20px}
.gram-formats button {border:1px solid var(--gr-rule);border-radius:22px;padding:8px 16px}
.gram-formats button[aria-pressed=true] {background:var(--gr-wine);color:white;border-color:var(--gr-wine)}
.gram-count {display:flex;justify-content:space-between;gap:12px;font-size:13px}
.gram-task progress {display:block;accent-color:var(--gr-wine);width:100%;height:5px;margin:10px 0 28px;border:0;background:#e7dedc}
.gram-task progress::-webkit-progress-bar {background:#e7dedc}
.gram-task progress::-webkit-progress-value {background:var(--gr-wine)}
.gram-task h3 {font-size:clamp(20px,2.2vw,30px)}
.gram-tray {background:#eaf3f8;border-bottom:2px solid var(--gr-rule);min-height:64px;margin:20px 0 16px;align-items:center;padding:8px}
.gram-bank button,.gram-tray button,.gram-options button {border:1px solid #b8a9a8;padding:6px 14px;background:var(--gr-paper);border-radius:4px}
.gram-bank button[disabled] {opacity:.45}
.gram-bank .zh,.gram-tray .zh,.gram-options .zh {font-size:23px}
.gram-options {margin-top:16px}
.gram-options button[aria-pressed=true] {background:#e7d3da;border-color:var(--gr-wine)}
.gram-feedback:not(:empty) {line-height:1.5;margin-top:20px;padding:12px 15px;border-left:3px solid}
.gram-ok {background:#e3ede1;border-color:#587151!important}
.gram-err {background:#f5e4de;border-color:#955548!important}
.gram .gram-primary {background:var(--gr-wine);border:none;color:white;border-radius:24px;padding:10px 20px;margin-top:18px}
.gram-primary:disabled {opacity:.52}
@media(hover:hover){.gram button:not(:disabled):hover {box-shadow:inset 0 0 0 1px var(--gr-wine)}}
@media(prefers-reduced-motion:no-preference){.gram-formula,.gram-examples,.gram-task,.gram-feedback:not(:empty) {animation:grammar-enter .22s ease-out}@keyframes grammar-enter{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
@media(max-width:720px){.gram-intro {grid-template-columns:1fr;gap:20px}.gram-lesson,.gram-examples{grid-template-columns:1fr}.gram-chapters{flex-direction:row;flex-wrap:wrap;gap:4px}.gram-chapters button{font-size:14px;padding:8px;gap:6px}.gram-question{padding-left:14px}.gram-tabs {gap:16px}.gram-paper{padding:16px}.gram-formula button {padding:8px}.gram-count{flex-wrap:wrap}}

.lex-head h1,.lex-head h2,.lex-head p{margin:0}
.lex-head h1{font-size:clamp(52px,8vw,96px);font-weight:500;line-height:1.16;color:#672f43}
.lex-head h2{font:normal clamp(27px,4vw,48px)/1.15 Georgia,serif;margin-top:8px}
.lex-progress{width:min(190px,36%);display:grid;gap:10px;font-size:14px}
.lex-progress progress{width:100%;height:5px;appearance:none;border:0;background:#bcccd4;border-radius:0}
.lex-progress progress::-webkit-progress-bar{background:#bcccd4}.lex-progress progress::-webkit-progress-value{background:#672f43}
.lex-progress progress::-moz-progress-bar{background:#672f43}

.lex-count,.lex-detail h3{font-size:12px;letter-spacing:.06em;font-weight:600}
.lex-count{margin:16px 0;color:#535760}
.lex-entry{border-top:1px solid #afc0c8}.lex-entry:last-child{border-bottom:1px solid #afc0c8}
.lex-row,.lex-select{display:flex;align-items:center}
.lex-select{width:100%;text-align:left;gap:16px;background:transparent;border:0;padding:17px 4px}
.lex-select[aria-expanded=true]{color:#672f43}
.lex-select:hover .lex-hanzi,.lex-mark:hover,.lex-replay:hover{color:#672f43}

.lex-select .py{width:22%;color:#61535b}.lex-select .ru{flex:1}
.lex-plus{margin-left:auto;padding:5px 10px;font-size:20px;color:#672f43}
.lex-mark{width:44px;height:44px;min-width:44px;border:0;background:transparent;display:grid;place-items:center}
.lex-mark[aria-pressed=true]{color:#672f43}
.lex-detail{display:flex;align-items:center;justify-content:space-between;gap:24px;background:#faf7f2;padding:clamp(16px,3vw,32px);margin-bottom:14px}
.lex-detail h3{margin:0 0 14px}.lex-detail p{margin:6px 0}
.lex-detail .lex-ex{font-size:clamp(22px,2.8vw,32px);line-height:1.5}
.lex-written{flex:none;text-align:center}.lex-diagrams{display:flex;justify-content:center;gap:5px}
.lex-diagrams svg{width:clamp(58px,7.5vw,94px);border:1px solid #d6c9ba;background:#f8f2e8}
.lex-replay{color:#672f43!important;text-decoration:underline;text-underline-offset:3px}
.lex-ink{stroke-dasharray:1;stroke-dashoffset:1;animation:lex-write .31s ease-in-out var(--delay) forwards}
@keyframes lex-write{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.lex-ink{animation:none;stroke-dashoffset:0}}
@media(max-width:650px){.lex-head{align-items:center}.lex-select{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:12px 4px}.lex-hanzi{min-width:0}.lex-select .py,.lex-select .ru{grid-column:1;width:auto}.lex-plus{grid-column:2;grid-row:1}.lex-detail{align-items:flex-start;flex-direction:column;gap:12px}.lex-tools{gap:9px}.lex-search{max-width:none}.lex-filters button{padding:6px 9px}.lex-diagrams svg{width:72px}}
.lex-shell,.lex-shell *{box-sizing:border-box}
.lex-shell .lex-head{background:transparent;position:static}

:root {
  --key-surface:#dfedf7;
  --key-edge:#6e8ba2;
  --key-shadow:inset 0 1px #ffffffb8,0 2px 0 #7894a957;
  --ease-out:cubic-bezier(.22,1,.36,1);
}
:is(.mast nav a,.practice-path a,.views button,.gram-tabs button,.gram-formats button,.lex-filters button,.bp-modes button,.bp-secondary button,[data-ga="check"],[data-cmd="check"],[data-ga="retry"])::before,.spot::before {
  content:""; display:inline-block; flex:none; width:1.05em; height:1.05em;
  margin-inline-end:.48em; vertical-align:-.15em; background:currentColor;
  mask:var(--tool-icon) center / contain no-repeat;
}
.mast nav a small {display:none}
.mast nav a,.views button,.practice-path a,.gram-tabs button,.gram-formats button,.bp-modes button,.bp-levels button,.bp-secondary button,.lex-filters button,.cardfoot button,.switches button {
  border:1px solid var(--key-edge); border-radius:6px;
  background:var(--key-surface); color:#283a49; box-shadow:var(--key-shadow);
  transition:background-color .22s,color .18s,border-color .22s,box-shadow .22s,translate .22s var(--ease-out);
}
.mast nav,.views,.gram-tabs,.bp-modes,.bp-secondary {gap:7px}
.mast nav a,.views button,.gram-tabs button,.bp-modes button,.bp-secondary button {padding:8px 12px}
.switches button {padding:5px 8px}
.mast nav a[aria-current]:after {display:none}
.gram-tabs {padding-bottom:9px}
.cardfoot button {width:40px;height:36px}.bp-secondary button{text-decoration:none}
:is(.mast nav a,.views button,.practice-path a,.gram-tabs button,.gram-formats button,.bp-modes button,.bp-levels button,.lex-filters button):is([aria-current],[aria-pressed=true],.is-on) {
  background:var(--wine); color:#fffaf6; border-color:#5c293d; box-shadow:inset 0 1px #ffffff24,0 2px 0 #52304136;
}
.poster .poster-label,.plate .spot {
  border:1px solid var(--key-edge);border-radius:6px;background:#e4f0f9;color:#273849;
  box-shadow:var(--key-shadow);padding-inline:8px 23px;
}
.poster .poster-label.east {text-align:right;padding-inline:23px 8px}
.spot::before {position:absolute;right:5px;top:6px;width:13px;height:13px;margin:0;color:#4d697f}
.poster-label.east::before {right:auto;left:5px}
.poster .poster-label[aria-pressed=true],.plate .spot[aria-pressed=true]{color:white;background:var(--wine);border-color:var(--wine)}
.spot[aria-pressed=true]::before{color:inherit}
@media (hover:hover) {
  :is(.mast nav a,.views button,.practice-path a,.gram-tabs button,.gram-formats button,.bp-modes button,.bp-levels button,.bp-secondary button,.lex-filters button,.cardfoot button,.switches button):hover {
    translate:0 -1px;border-color:var(--wine);box-shadow:inset 0 0 0 1px #672f4336,0 3px 7px #30465a20
  }
}
#main>*{animation:none}
.lex-detail{animation:studio-entry .34s var(--ease-out)}
@keyframes studio-entry{from{opacity:.35;translate:0 6px}to{opacity:1;translate:0 0}}
@supports (view-transition-name:studio-page) {
  :root{view-transition-name:none}
  #main{view-transition-name:studio-page}
  ::view-transition{pointer-events:none}
  ::view-transition-group(studio-page){animation:none}
  ::view-transition-old(studio-page),::view-transition-new(studio-page){mix-blend-mode:normal;object-position:top}
  ::view-transition-old(studio-page){animation:studio-leave .18s ease-out both}
  ::view-transition-new(studio-page){animation:studio-arrive .36s var(--ease-out) both}
}
@keyframes studio-leave{to{opacity:0}}
@keyframes studio-arrive{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media(max-width:1050px){.mast{gap:9px}.mast nav a{padding:7px 8px;font-size:13px}.switches{gap:5px}}
@media(max-width:780px){
  .mast nav{gap:4px;flex-wrap:wrap;padding-bottom:7px;justify-content:flex-start}
  .mast nav a{flex:1 1 auto;font-size:12px;text-align:center;padding:7px 4px;min-height:42px;align-content:center}
  .switches button{padding:4px 5px}.views{gap:5px}.views button{padding:7px 10px}
  .poster .poster-label,.plate .spot{padding-inline:5px 17px}
  .poster .poster-label.east{padding-inline:17px 5px}
  .spot::before{width:10px;height:10px;right:3px;top:5px}.poster-label.east::before{left:3px}
}
@media(max-width:370px){.mast nav a{font-size:11px}.mast nav a::before{margin-inline-end:.22em}}
@media(prefers-reduced-motion:reduce){.lex-detail{animation:none}.mast nav a:hover,.views button:hover,.cardfoot button:hover{translate:none}}

<script>// Keep route changes interruptible. Local exercise controls update immediately.
window.studioMotion = (() => {
  const reduced = matchMedia("(prefers-reduced-motion: reduce)");
  let transition;
  function enter(element) {
    if (reduced.matches || !element?.animate) return;
    element.animate([{opacity:.45, translate:"0 6px"}, {opacity:1, translate:"0 0"}],
      {duration:340, easing:"cubic-bezier(.22,1,.36,1)"});
  }
  function navigate(render) {
    transition?.skipTransition();
    if (reduced.matches || !document.startViewTransition) {
      render();
      enter(document.querySelector("#main"));
      return;
    }
    const current = document.startViewTransition(render);
    transition = current;
    // When the next navigation interrupts a snapshot, ready rejects even though rendering succeeds.
    current.ready.catch(() => {});
    current.finished.finally(() => { if (transition === current) transition = null; });
  }
  return {enter, navigate};
})();

    const bank = isBuild ? `<div class="gram-tray" aria-label="Ваша фраза">${s.picked.length?s.picked.map((i,pos)=>button("remove",pos,chinese(s.bank[i]),`aria-label="Убрать ${s.bank[i]}" ${locked?"disabled":""}`)).join(""):"<small>Здесь появится ваша фраза</small>"}</div><div class="gram-bank">${s.bank.map((word,i)=>button("pick",i,chinese(word),s.picked.includes(i)||locked?"disabled":"")).join("")}</div>` :
    `<div class="gram-options">${s.bank.map((w,i)=>button("option",i,q.optionLanguage==="ru"?w:chinese(w),`${selected(s.option===i)} ${locked?"disabled":""}`)).join("")}</div>`;
    return `${formats}<article class="gram-paper gram-task"><div class="gram-count"><span>${formatNames[f]}</span><span>Вопрос ${s.index+1} из ${sets[f].length}</span></div><progress max="${sets[f].length}" value="${s.index}"></progress>
    <h3>${q.py?chinese(q.prompt):q.prompt}</h3>${q.py?`<p class="py" lang="zh-Latn">${q.py}</p>`:""}<p>${isBuild?"Выберите все блоки по порядку. Нажмите на добавленный блок, чтобы вернуть его.":"Выберите один вариант."}</p>${bank}
    <div class="gram-feedback ${s.result===true?"gram-ok":s.result===false?"gram-err":""}" aria-live="polite">${locked?`<strong>${s.result?"Верно.":"Пока есть ошибка."}</strong> ${q.why}`:""}</div>
    ${locked?(s.result?button("next",0,s.index===sets[f].length-1?"Завершить серию":"Следующий вопрос →",'class="gram-primary"'):button("retry",0,"Попробовать снова",'class="gram-primary"')):button("check",0,"Проверить",`class="gram-primary" ${valid?"":"disabled"}`)}</article>`;
  }
  let directFormat=4;
  window.renderGrammar = function(root, practiceOnly=false) {
    if(practiceOnly) state.format=directFormat;
    root.innerHTML = `<section class="gram"><div class="gram-intro"><div><h2 class="zh" lang="zh-Hans">时量补语</h2><span class="py">shíliàng bǔyǔ</span><h3 class="ru">Дополнение длительности</h3></div>
      <div class="gram-question">${pair(["多长时间？","duō cháng shíjiān?","Как долго?"])}<p>Дополнение длительности показывает, сколько времени длилось или длится действие.</p></div></div>

    const wrap = root.querySelector(".gram");
    if(practiceOnly){
      wrap.querySelector(".gram-intro").innerHTML='<div><h2>Практика по грамматике</h2><p>Длительность действия · <span lang="zh">时量补语</span></p></div>';
      wrap.querySelector(".gram-tabs").remove();
      wrap.classList.add("direct-practice");
    }
    const panel = wrap.querySelector(".gram-content");
    function draw() {
      panel.innerHTML = practiceOnly?practice():state.tab===0?lesson():state.tab===1?`<div class="gram-examples">${examples.map((e,i)=>`<article><small>0${i+1}</small><div>${pair(e)}</div></article>`).join("")}</div>`:practice();
      wrap.querySelectorAll('[data-ga="tab"]').forEach((b,i)=>b.setAttribute("aria-pressed",i===state.tab));
    }
    draw();
    wrap.onclick = event => {
      const b = event.target.closest("button[data-ga]");
      if (!b || b.disabled) return;
      const a=b.dataset.ga, v=Number(b.dataset.value);
      const f=state.format;
      const s=sessionFor(f);
      const q=sets[f][s.index];
      if (a==="tab") state.tab=v;
      if (a==="pattern") {state.pattern=v; state.role=null;}
      if (a==="role") state.role=v;
      if (a==="format") {state.format=v; if(practiceOnly) directFormat=v;}
      if (a==="restart") {
        state.sessions[f]=newSession(f);
        saveProgress(f,state.sessions[f]);
      }
      if (a==="option") s.option=v;
      if (a==="pick") s.picked.push(v);
      if (a==="remove") s.picked.splice(v,1);
      if (a==="retry") {s.picked=[]; s.option=null; s.result=null;}
      if (a==="check") {
        s.result=q.tokens?[q.tokens.join(""),...q.alternatives].includes(s.picked.map(i=>s.bank[i]).join("")):s.bank[s.option]===q.good;
        if (s.result&&!s.attempted) s.first++;
        s.attempted=true;
        saveProgress(f,s);
      }
      if (a==="next") {
        s.index++;
        if (sets[f][s.index]) prepare(s,sets[f][s.index]);
      }
      draw();
      if (["tab","format","pattern","next","restart"].includes(a)) {
        studioMotion.enter(a==="tab"?panel:panel.querySelector(".gram-paper"));
      }
      const next = wrap.querySelector(`[data-ga="${a}"][data-value="${v}"]:not(:disabled)`) || panel.querySelector(".gram-primary:not(:disabled),.gram-bank button:not(:disabled),.gram-options button:not(:disabled)") || panel.querySelector("button");
      next?.focus({preventScroll:true});
    };
  };
})();

  function layoutPoster() {
    posterObserver?.disconnect();
    const panel=$(".poster");
    if(!panel) return;
    const svg=panel.querySelector("svg"), image=panel.querySelector("img");
    function draw(){
      const width=panel.clientWidth,height=panel.clientHeight,iw=image.offsetWidth,ih=image.offsetHeight;
      if(!width||!ih) return;
      const lines=[];
      for(const side of ["west","east"]){
        const labels=[...panel.querySelectorAll("."+side)];
        labels.forEach((label,row)=>{
          const cy=(row+.5)*height/labels.length;
          label.style.top=cy+"px";
          const x=(width-iw)/2+iw*Number(label.dataset.x)/100;
          const y=(height-ih)/2+ih*Number(label.dataset.y)/100;
          const end=side==="west"?label.offsetLeft+label.offsetWidth+3:label.offsetLeft-3;
          const elbow=end+(x-end)*.30;
          const chosen=label.getAttribute("aria-pressed")==="true";
          lines.push(`<g class="${chosen?"picked":""}" data-line="${label.dataset.word}"><path ${chosen?'pathLength="1"':""} d="M${x} ${y} L${elbow} ${cy} H${end}"/><circle cx="${x}" cy="${y}" r="${chosen?4:2.3}"/>${chosen?`<circle class="ripple" cx="${x}" cy="${y}" r="8"/>`:""}</g>`);
        });
      }
      svg.setAttribute("viewBox",`0 0 ${width} ${height}`);
      svg.innerHTML=lines.join("");
    }
    posterObserver=new ResizeObserver(draw);
    posterObserver.observe(panel);posterObserver.observe(image);
    for(const label of panel.querySelectorAll(".poster-label")){
      posterObserver.observe(label);
      const highlight=on=>svg.querySelector('[data-line="'+label.dataset.word+'"]')?.classList.toggle("hovered",on);
      label.onpointerenter=label.onfocus=()=>highlight(true);
      label.onpointerleave=label.onblur=()=>highlight(false);
    }
    panel.querySelector("svg").onclick=e=>{
      const group=e.target.closest("[data-line]");
      if(group)panel.querySelector('[data-word="'+group.dataset.line+'"]').click();
    };
    draw();
  }
  function figure() {

  function card() {

  function atlas() {
    const root=$("#main");
    root.innerHTML='<section class="exhibit"><div class="spread"><div class="intro"><div class="chapter"><i></i>01 / BODY EXPLORER</div><h1 lang="zh">认识<br>我们的身体</h1><div class="titlepy py">Rènshi wǒmen de shēntǐ</div><p class="subtitle ru">Знакомимся<br> с нашим телом</p><p class="instructions">Выберите подпись на рисунке. Для уха, зубов и спины откройте отдельный ракурс.</p><a class="primary" href="#practice">К практике <span>↗</span></a></div><div class="figurewrap">'+figure()+'</div>'+card()+'</div><div class="viewbar"><b class="mini">РАКУРСЫ И ДЕТАЛИ</b><div class="views">'+Object.entries(viewNames).map(([v,n])=>'<button data-view="'+v+'" aria-pressed="'+(view===v)+'">'+n+'</button>').join('')+'</div><span class="platecount">身体部位 &nbsp; / &nbsp; 27 слов</span></div></section><section class="catalog"><div class="catalogtitle"><div><span class="mini">身体部位 / BODY PARTS</span><h2>Указатель атласа</h2></div><span class="indexnum">01 — 27</span></div><div class="catalogcols">'+[[0,8,"Голова и лицо"],[8,18,"Туловище и руки"],[18,23,"Ноги и стопы"],[23,27,"Крупным планом"]].map(([a,b,n])=>'<div><h3>'+n+'</h3>'+words.slice(a,b).map((w,k)=>'<button class="wordrow" data-jump="'+(a+k)+'"><small>'+pad(a+k+1)+'</small><b lang="zh">'+w.zh+'</b><span class="ru">'+w.ru+'</span><i>↗</i></button>').join('')+'</div>').join('')+'</div></section>';
    layoutPoster();
    root.onclick=e=>{const b=e.target.closest("button");if(!b)return;
      if(b.dataset.word!==undefined){select(+b.dataset.word,true,true);if(!matchMedia('(max-width:780px)').matches)root.querySelector('.spot[data-word="'+index+'"]')?.focus({preventScroll:true})}
      if(b.dataset.jump!==undefined){select(+b.dataset.jump);window.scrollTo(0,0)}
      if(b.dataset.view){view=b.dataset.view;index=presets[view][view==="front"?1:0];sheet=false;atlas();studioMotion.enter(root.querySelector(".figurewrap"));root.querySelector('[data-view="'+view+'"]').focus({preventScroll:true})}
      if(b.id==="prev"||b.id==="next"){select(index+(b.id==="next"?1:-1));$("#"+b.id).focus({preventScroll:true})}
      if(b.id==="close-card"){sheet=false;atlas();root.querySelector('.spot[aria-pressed="true"]')?.focus({preventScroll:true})}
    };
  }
  function route() {
    posterObserver?.disconnect();
    const page=location.hash.slice(1);
    const exercises=page==="practice"||page==="practice/grammar";
    const root=$("#main");
    root.onclick=null;root.innerHTML="";sheet=false;
    const active=exercises?"practice":["words","grammar"].includes(page)?page:"body";
    document.querySelectorAll("nav a").forEach(a=>{
      if(a.hash==="#"+active)a.setAttribute("aria-current","page");
      else a.removeAttribute("aria-current");
    });
    if(exercises){
      const grammar=page.endsWith("/grammar");
      root.innerHTML=`<div class="practice-path" role="group" aria-label="Практика по теме"><a href="#practice" ${grammar?"":'aria-current="page"'}>Части тела</a><a href="#practice/grammar" ${grammar?'aria-current="page"':""}>Грамматика · длительность</a></div><div id="exercise-panel"></div>`;
      if(grammar)window.renderGrammar($("#exercise-panel"),true);
      else window.renderPractice($("#exercise-panel"));
    }else if(active==="grammar")window.renderGrammar(root);
    else if(active==="words")window.renderLexicon(root);
    else atlas();
    window.scrollTo(0,0);
  }
  addEventListener("hashchange",()=>studioMotion.navigate(route));route();
})();
